<script>
// ========================= 全局状态 =========================
const S = {
  db: null,
  categories: [],
  standards: [],
  specs: {},
  sections: [],
  unitEngineerings: [],
  divisions: [],
  signers: { construction: [], supervision: [] },
  testUnits: [],
  settings: {},
  records: [],
  tab: 'dashboard',
  ledgerFilters: {},
  ledgerPage: 1,
  pageSize: 50
};

const TABS = [
  { key: 'dashboard', label: '看板' },
  { key: 'upload', label: '上传' },
  { key: 'ledger', label: '台账' },
  { key: 'matrix', label: '预控矩阵' },
  { key: 'sections', label: '标段单位工程' },
  { key: 'categories', label: '类别管理' },
  { key: 'standards', label: '判定标准' },
  { key: 'settings', label: '系统设置' }
];

// ========================= IndexedDB 封装 =========================
const DB = {
  name: 'quality_ledger',
  version: 4,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.version);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        const stores = {
          records: { keyPath: 'record_id' },
          categories: { keyPath: 'key' },
          standards: { keyPath: 'id', autoIncrement: true },
          sections: { keyPath: 'code' },
          unit_engineerings: { keyPath: 'ue_code' },
          divisions: { keyPath: 'code' },
          signers: { keyPath: 'id', autoIncrement: true },
          test_units: { keyPath: 'name' },
          settings: { keyPath: 'k' },
          file_hashes: { keyPath: 'hash' }
        };
        for (const [name, opts] of Object.entries(stores)) {
          if (!db.objectStoreNames.contains(name)) {
            const os = db.createObjectStore(name, opts);
            if (name === 'records') {
              os.createIndex('report_specimen', ['report_no', 'specimen_no'], { unique: false });
              os.createIndex('section', 'section', { unique: false });
              os.createIndex('category', 'category', { unique: false });
              os.createIndex('is_deleted', 'is_deleted', { unique: false });
              os.createIndex('judgment', 'judgment', { unique: false });
              os.createIndex('unit_work', 'unit_work', { unique: false });
              os.createIndex('division', 'division', { unique: false });
            }
          }
        }
        // v3：report_no+specimen_no 唯一索引改非唯一（见证台账空编号场景）
        if (db.objectStoreNames.contains('records')) {
          const os = e.target.transaction.objectStore('records');
          if (os.indexNames.contains('report_specimen')) os.deleteIndex('report_specimen');
          os.createIndex('report_specimen', ['report_no', 'specimen_no'], { unique: false });
        }
        // v4：新增 unit_work、division 索引（仅增量，跳过已存在的）
        if (db.objectStoreNames.contains('records')) {
          const os = e.target.transaction.objectStore('records');
          if (!os.indexNames.contains('unit_work')) os.createIndex('unit_work', 'unit_work', { unique: false });
          if (!os.indexNames.contains('division')) os.createIndex('division', 'division', { unique: false });
        }
      };
      req.onsuccess = (e) => { S.db = e.target.result; resolve(); };
      req.onerror = (e) => reject(e.target.error);
    });
  },
  tx(store, mode = 'readonly') {
    return S.db.transaction(store, mode).objectStore(store);
  },
  getAll(store) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  put(store, value) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store, 'readwrite').put(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  bulkPut(store, values) {
    return new Promise((resolve, reject) => {
      const tx = S.db.transaction(store, 'readwrite');
      const os = tx.objectStore(store);
      values.forEach(v => os.put(v));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  delete(store, key) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store, 'readwrite').delete(key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },
  clear(store) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store, 'readwrite').clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },
  getFileHash(hash) {
    return new Promise((resolve) => {
      const req = this.tx('file_hashes').get(hash);
      req.onsuccess = () => resolve(req.result || null);
    });
  },
  putFileHash(hash, fileName) {
    return this.put('file_hashes', { hash, file_name: fileName, imported_at: Date.now() });
  }
};

// ========================= 工具函数 =========================
function uuid() {
  return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}
function fmt(n, d = 1) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toFixed(d);
}
function fmtPct(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return (n * 100).toFixed(1) + '%';
}
function formatDate(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function todayStr() {
  return formatDate(new Date());
}
function sha256Buf(buf) {
  return crypto.subtle.digest('SHA-256', buf).then(h =>
    Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''));
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
}
function downloadJSON(obj, filename) {
  downloadBlob(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }), filename);
}
function showModal(html) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
function log(msg, type = '') {
  const logEl = document.getElementById('uploadLog');
  if (!logEl) return;
  const div = document.createElement('div');
  div.className = type;
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function buildDefaultStandards() {
  return EMBED_DEFAULTS.standards;
}

async function fetchJSON(url, fallback) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('加载失败: ' + url);
    return await r.json();
  } catch (e) {
    if (fallback !== undefined) return fallback; // file:// 下兜底
    throw e;
  }
}

async function loadConfig() {
  // 从 IndexedDB 读配置，若空则从默认 JSON 加载（file:// 下用内嵌副本）
  let [cats, stds, secs, ues, divs, signers, tests, sets] = await Promise.all([
    DB.getAll('categories'), DB.getAll('standards'), DB.getAll('sections'),
    DB.getAll('unit_engineerings'), DB.getAll('divisions'), DB.getAll('signers'),
    DB.getAll('test_units'), DB.getAll('settings')
  ]);

  // 配置版本迁移：内置默认配置升级后（如新增检测类别），自动同步到已建库；检测记录/签字人/检测单位不动
  const settingsMap = {};
  sets.forEach(s => { settingsMap[s.k] = s.v; });
  const embeddedVer = Number(EMBED_DEFAULTS.config_version || 1);
  const storedVer = Number(settingsMap.config_version || 1);
  const needUpgrade = storedVer < embeddedVer;

  if (cats.length === 0 || needUpgrade) {
    const def = await fetchJSON('assets/config/default-categories.json', EMBED_DEFAULTS.categories);
    if (needUpgrade) await DB.clear('categories');
    await DB.bulkPut('categories', def);
    cats = def;
  }
  S.categories = cats;

  if (stds.length === 0 || needUpgrade) {
    const def = await fetchJSON('assets/config/default-standards.json', buildDefaultStandards());
    if (needUpgrade) await DB.clear('standards');
    await DB.bulkPut('standards', def);
    stds = def;
  }
  S.standards = stds;

  const specsDef = await fetchJSON('assets/config/default-specs.json', EMBED_DEFAULTS.specs);
  S.specs = specsDef;

  // 项目划分清单（标段 / 单位工程 / 分部工程）：为空或版本升级时从 default-project.json 装载
  if (!secs.length || !ues.length || !divs.length || needUpgrade) {
    const proj = await fetchJSON('assets/config/default-project.json', EMBED_DEFAULTS.project);
    if (needUpgrade) {
      await DB.clear('sections'); await DB.clear('unit_engineerings'); await DB.clear('divisions');
    }
    if ((!secs.length || needUpgrade) && proj.sections) { await DB.bulkPut('sections', proj.sections); secs = proj.sections; }
    if ((!ues.length || needUpgrade) && proj.unit_engineerings) { await DB.bulkPut('unit_engineerings', proj.unit_engineerings); ues = proj.unit_engineerings; }
    if ((!divs.length || needUpgrade) && proj.divisions) { await DB.bulkPut('divisions', proj.divisions); divs = proj.divisions; }
  }
  S.sections = secs;
  S.unitEngineerings = ues;
  S.divisions = divs;
  S.signers = { construction: [], supervision: [] };
  signers.forEach(s => { if (S.signers[s.role]) S.signers[s.role].push(s); });
  S.testUnits = tests;
  S.settings = settingsMap;

  if (needUpgrade) {
    settingsMap.config_version = String(embeddedVer);
    await DB.put('settings', { k: 'config_version', v: String(embeddedVer) });
  }

  S.records = await DB.getAll('records');
}

// ========================= 判定逻辑 =========================
function getCategory(key) { return S.categories.find(c => c.key === key); }
function getStandard(categoryKey, spec) {
  return S.standards.find(s => s.category_key === categoryKey && (s.spec === spec || s.spec === '*'));
}

function judgeRecord(rec) {
  const cat = getCategory(rec.category);
  if (!cat) return '合格';
  const std = getStandard(rec.category, rec.spec);
  if (!std) return '合格'; // 无标准则不自动判定
  const f = rec.category_fields || {};
  if (cat.key === 'concrete_compressive') {
    // 单组判定：代表值 >= 0.95*fcu_k 且单组 >= 0.85*fcu_k（非统计法单组标准）
    const fcuK = std.fcu_k;
    const rep = Number(f.representative_value_mpa || f.strength_mpa);
    const str = Number(f.strength_mpa);
    if (isNaN(rep) && isNaN(str)) return '合格';
    const val = isNaN(rep) ? str : rep;
    return val >= 0.95 * fcuK && str >= 0.85 * fcuK ? '合格' : '不合格';
  }
  if (cat.key === 'rebar_tensile') {
    const y = Number(f.yield_strength_mpa), t = Number(f.tensile_strength_mpa), e = Number(f.elongation_percent);
    const cb = f.cold_bend;
    if (isNaN(y) || isNaN(t) || isNaN(e)) return '合格';
    const ok = y >= (std.yield_min || 0) && t >= (std.tensile_min || 0) && e >= (std.elongation_min || 0) &&
               (!std.cold_bend_required || cb === '合格');
    return ok ? '合格' : '不合格';
  }
  if (cat.key === 'rebar_welded_joint') {
    const t = Number(f.tensile_strength_mpa);
    const loc = f.fracture_location, form = f.fracture_form;
    // 弯曲性能（闪光对焊/气压焊需做弯曲试验，JGJ 18）：填"不合格"直接判不合格
    if (f.bend_performance === '不合格') return '不合格';
    if (isNaN(t)) return '合格';
    // 母材牌号对应抗拉下限
    const baseStd = getStandard('rebar_tensile', f.grade);
    const tmin = baseStd ? baseStd.tensile_min : 540;
    const locPass = (std.fracture_location_pass || ['母材']).includes(loc);
    const formPass = (std.fracture_form_pass || ['延性']).includes(form);
    return t >= tmin && locPass && formPass ? '合格' : '不合格';
  }
  if (cat.key === 'mortar_compressive') {
    const fcuK = Number(String(rec.spec).replace(/[^\d.]/g, '')) || 0;
    const rep = Number(f.representative_value_mpa || f.strength_mpa);
    const str = Number(f.strength_mpa);
    if (!fcuK || (isNaN(rep) && isNaN(str))) return '合格';
    const val = isNaN(rep) ? str : rep;
    return val >= fcuK && str >= 0.75 * fcuK ? '合格' : '不合格';
  }
  if (cat.key === 'concrete_flexural') {
    const d = Number(rec.spec), s = Number(f.flexural_strength_mpa);
    if (isNaN(d) || isNaN(s)) return '合格';
    return s >= d ? '合格' : '不合格';
  }
  if (cat.key === 'concrete_impermeability') {
    const d = Number(String(rec.spec).replace(/[^\d]/g, ''));
    const m = Number(String(f.measured_grade || '').replace(/[^\d]/g, ''));
    if (!d || !m) return '合格';
    return m >= d ? '合格' : '不合格';
  }
  if (cat.key === 'concrete_frost') {
    const d = Number(String(rec.spec).replace(/[^\d]/g, ''));
    const c = Number(f.freeze_cycles);
    if (!d || isNaN(c)) return '合格';
    const rd = f.relative_dynamic_modulus;
    const okRdm = (rd === undefined || rd === '' || isNaN(Number(rd))) ? true : Number(rd) >= 60;
    return c >= d && okRdm ? '合格' : '不合格';
  }
  if (cat.key === 'compaction_degree') {
    const d = Number(rec.spec), p = Number(f.compaction_percent);
    if (isNaN(d) || isNaN(p)) return '合格';
    return p >= d ? '合格' : '不合格';
  }
  if (cat.key === 'rebar_mech_joint') {
    const t = Number(f.tensile_strength_mpa);
    if (isNaN(t)) return '合格';
    const baseStd = getStandard('rebar_tensile', f.grade);
    const tmin = baseStd ? baseStd.tensile_min : 540;
    return t >= tmin ? '合格' : '不合格';
  }
  if (cat.key === 'prestress_strand') {
    const t = Number(f.tensile_strength_mpa);
    if (isNaN(t)) return '合格';
    return t >= (std.tensile_min || 1860) ? '合格' : '不合格';
  }
  if (cat.key === 'pile_integrity') {
    const c = String(f.integrity_category || '');
    if (!c) return '合格';
    return (std.pass_categories || ['I', 'II']).map(String).includes(c) ? '合格' : '不合格';
  }
  if (cat.key === 'cement_material') {
    if (f.soundness === '不合格') return '不合格';
    const c = Number(f.compressive_28d_mpa);
    if (isNaN(c) || !std.compressive_28d_min) return '合格';
    return c >= std.compressive_28d_min ? '合格' : '不合格';
  }
  return '合格';
}

// ========================= 看板 =========================
function activeRecords() {
  return S.records.filter(r => !r.is_deleted);
}
function computeMatrix() {
  const recs = activeRecords();
  const sectionSet = new Set(recs.map(r => r.section));
  const catSet = new Set(recs.map(r => r.category));
  const sections = S.sections.length ? S.sections.map(s => s.code) : [...sectionSet].sort();
  const cats = S.categories.map(c => c.key).filter(k => catSet.has(k));
  const matrix = {};
  for (const sec of sections) {
    matrix[sec] = {};
    for (const cat of cats) {
      const list = recs.filter(r => r.section === sec && r.category === cat);
      const total = list.length;
      const pass = list.filter(r => r.judgment === '合格').length;
      const fail = total - pass;
      matrix[sec][cat] = { total, pass, fail, rate: total ? pass / total : null };
    }
  }
  return { sections, cats, matrix };
}
function renderDashboard() {
  const recs = activeRecords();
  const total = recs.length;
  const pass = recs.filter(r => r.judgment === '合格').length;
  const fail = total - pass;
  const rate = total ? pass / total : 0;
  const failRecs = recs.filter(r => r.judgment === '不合格');

  // 最大不合格率标段
  const bySec = {};
  recs.forEach(r => {
    if (!bySec[r.section]) bySec[r.section] = { t: 0, f: 0 };
    bySec[r.section].t++;
    if (r.judgment === '不合格') bySec[r.section].f++;
  });
  let worstSec = null, worstRate = -1;
  for (const [sec, v] of Object.entries(bySec)) {
    if (v.t > 0) { const rt = v.f / v.t; if (rt > worstRate) { worstRate = rt; worstSec = sec; } }
  }

  const { sections, cats, matrix } = computeMatrix();

  let html = `
  <div class="stat-cards">
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总试件数</div></div>
    <div class="stat-card"><div class="num">${fmtPct(rate)}</div><div class="lbl">总合格率</div></div>
    <div class="stat-card danger"><div class="num">${fail}</div><div class="lbl">不合格总数</div></div>
    <div class="stat-card ${worstRate > 0 ? 'warn' : ''}"><div class="num">${worstSec ? worstSec + ' (' + fmtPct(worstRate) + ')' : '—'}</div><div class="lbl">最大不合格率标段</div></div>
  </div>
  <div class="card">
    <h2>标段 × 检测类别 合格率矩阵</h2>
    <table class="matrix">
      <thead><tr><th>标段 \\ 类别</th>${cats.map(k => `<th>${getCategory(k)?.name || k}</th>`).join('')}<th>合计</th></tr></thead>
      <tbody>`;
  for (const sec of sections) {
    let tSum = 0, fSum = 0;
    html += `<tr><th>${sec}</th>`;
    for (const cat of cats) {
      const m = matrix[sec][cat];
      tSum += m.total; fSum += m.fail;
      if (m.total === 0) html += `<td class="zero">—</td>`;
      else {
        const cls = m.fail > 0 ? 'bad' : 'ok';
        html += `<td class="${cls}">${fmtPct(m.rate)}<br><span class="muted">${m.pass}/${m.total} · 不合格${m.fail}</span></td>`;
      }
    }
    const sumRate = tSum ? (tSum - fSum) / tSum : null;
    html += `<td class="${fSum > 0 ? 'bad' : 'ok'}"><b>${fmtPct(sumRate)}</b><br><span class="muted">${tSum - fSum}/${tSum} · 不合格${fSum}</span></td></tr>`;
  }
  html += `</tbody></table></div>`;

  // 按分部工程口径统计（仅统计已有检测记录的分部工程）
  const byDiv = {};
  recs.forEach(r => {
    const key = r.division || '(未填写分部工程)';
    if (!byDiv[key]) byDiv[key] = { t: 0, f: 0 };
    byDiv[key].t++;
    if (r.judgment === '不合格') byDiv[key].f++;
  });
  const divList = Object.entries(byDiv).sort((a, b) => (b[1].f / b[1].t - a[1].f / a[1].t) || (b[1].t - a[1].t));
  if (divList.length) {
    html += `<div class="card"><h2>按分部工程合格率（${divList.length} 个分部工程有检测记录）</h2>
      <div style="overflow:auto;max-height:50vh"><table>
      <thead><tr><th>分部工程</th><th>试件数</th><th>合格</th><th>不合格</th><th>合格率</th></tr></thead><tbody>`;
    for (const [name, v] of divList) {
      const cls = v.f > 0 ? 'bad' : '';
      html += `<tr class="${cls}"><td>${name}</td><td>${v.t}</td><td>${v.t - v.f}</td><td>${v.f}</td><td>${fmtPct(v.t ? (v.t - v.f) / v.t : null)}</td></tr>`;
    }
    html += `</tbody></table></div></div>`;
  }

  html += `<div class="card"><h2>不合格清单（${failRecs.length} 条）</h2>`;
  if (failRecs.length === 0) {
    html += `<p class="muted">暂无不合格记录。</p>`;
  } else {
    html += `<table><thead><tr><th>标段</th><th>单位工程</th><th>单元工程</th><th>类别</th><th>规格</th><th>报告编号</th><th>试件编号</th><th>检测日期</th><th>判定</th></tr></thead><tbody>`;
    failRecs.slice(0, 100).forEach(r => {
      html += `<tr class="bad"><td>${r.section}</td><td>${r.unit_engineering}</td><td>${r.unit_work || r.part || ''}</td><td>${getCategory(r.category)?.name || r.category}</td><td>${r.spec}</td><td>${r.report_no}</td><td>${r.specimen_no}</td><td>${formatDate(r.test_date)}</td><td><span class="tag red">不合格</span></td></tr>`;
    });
    html += `</tbody></table>${failRecs.length > 100 ? '<p class="muted">仅显示前 100 条，请到「台账」Tab 按判定筛选查看全部。</p>' : ''}`;
  }
  html += `</div>`;
  return html;
}

function bindUpload() {
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  dz.onclick = () => fi.click();
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = () => dz.classList.remove('drag');
  dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

async function handleFile(file) {
  log('开始处理文件: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)');
  // 文件级去重
  const buf = await file.arrayBuffer();
  const hash = await sha256Buf(buf);
  const existed = await DB.getFileHash(hash);
  if (existed) {
    log(`该文件已于 ${formatDate(existed.imported_at)} 导入过，跳过。`, 'warn');
    return;
  }
  // 解析为若干数据集 { name, rows }；Excel 按 sheet，Word 按表格
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  let datasets = [];
  try {
    if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm') {
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      for (const sheetName of wb.SheetNames) {
        if (sheetName === '填写说明') continue;
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '', raw: false });
        datasets.push({ name: sheetName, rows });
      }
    } else if (ext === 'docx') {
      datasets = await readDocxTables(buf);
    } else if (ext === 'doc') {
      try {
        const { tables, paragraphs } = await parseDocFile(buf);
        datasets = tables.map((t, i) => ({ name: `table_${i + 1}`, rows: matrixToRecords(t) }));
        if (!datasets.length && paragraphs.length) {
          log(`旧版 .doc 解析：未找到表格，仅提取 ${paragraphs.length} 条文本段落，无法识别为台账。`, 'warn');
        }
      } catch (e) {
        log('旧版 .doc 解析失败：' + e.message + '。建议在 Word 中「另存为 .docx」后重新上传。', 'err');
        return;
      }
    } else {
      log('不支持的文件类型：.' + ext + '，请上传 .xlsx / .xls / .docx 文件。', 'err');
      return;
    }
  } catch (e) {
    log('解析失败: ' + e.message, 'err');
    return;
  }
  if (!datasets.length) { log('未从文件中解析到可用的表格数据。', 'warn'); return; }

  const forcedCat = document.getElementById('uploadCategory')?.value || '';
  const manualLoose = !!document.getElementById('looseMode')?.checked;

  // 将解析出的表格逐行归类、校验，返回 { valid, errors }
  const processDatasets = (loose) => {
    const allValid = [], allErrors = [];
    for (const ds of datasets) {
      // 过滤仅「序号」有值的预留空行（Word/Excel 见证台账常见）
      const dataItems = ds.rows
        .map((row, idx) => ({ row, idx }))
        .filter(x => !isEmptyDataRow(x.row));
      // 归类优先级：手动指定 > 表题/sheet 名识别 > 行级识别（见证台账一张表内混多种试验项目）
      let groups = [];
      if (forcedCat) {
        groups = [[forcedCat, dataItems]];
      } else {
        const titleKey = matchCategoryBySheet(ds.name);
        if (titleKey) {
          groups = [[titleKey, dataItems]];
        } else {
          const m = new Map();
          dataItems.forEach(({ row, idx }) => {
            const k = detectCategoryByRow(row, ds.name);
            if (!k) return;
            if (!m.has(k)) m.set(k, []);
            m.get(k).push({ row, idx });
          });
          groups = [...m.entries()];
          if (!groups.length) {
            const cols = Object.keys(ds.rows[0] || {}).slice(0, 12).join(' / ');
            log(`跳过「${ds.name}」：无法识别类别；检测到的表头 = ${cols || '(空)'}；可用上方下拉框手动指定类别`, 'warn');
            continue;
          }
          const recognized = groups.reduce((a, g) => a + g[1].length, 0);
          const skipped = dataItems.length - recognized;
          log(`「${ds.name}」表题未匹配类别，按每行“试验项目”识别为：${groups.map(([k]) => getCategory(k)?.name || k).join('、')}；共识别 ${recognized} 行${skipped ? `，${skipped} 行无法识别已跳过` : ''}`, 'warn');
        }
      }
      for (const [catKey, items] of groups) {
        const cat = getCategory(catKey);
        if (!cat) { log(`跳过「${ds.name}」：类别 ${catKey} 未配置`, 'warn'); continue; }
        if (forcedCat || matchCategoryBySheet(ds.name) === catKey) log(`「${ds.name}」→ ${cat.name}，共 ${items.length} 行`);
        for (const { row, idx } of items) {
          const rec = mapRowToRecord(row, cat, file.name);
          if (loose) rec.import_mode = 'witness_loose';
          const errs = validateRecord(rec, cat, loose);
          if (errs.length) {
            allErrors.push({ sheet: ds.name, row: idx + 2, ...rec, errors: errs });
          } else {
            // 源数据已带判定（如见证台账“试验结果”）则沿用，否则按标准自动判定
            rec.judgment = rec.judgment || judgeRecord(rec);
            allValid.push(rec);
          }
        }
      }
    }
    return { valid: allValid, errors: allErrors };
  };

  // 宽松导入自动判定：见证台账表头含「试验编号/试验项目/代表部位/试验结果」等标记时自动宽松，无需手动勾选
  const isWitness = looksLikeWitnessLedger(datasets);
  let loose = manualLoose || isWitness;
  if (loose && !manualLoose) log('检测到见证台账表头，已自动启用宽松导入（标段/单位工程/分部工程/规格可先为空入库）', 'warn');
  else if (manualLoose) log('已开启「见证台账宽松导入」', 'warn');

  let { valid: allValid, errors: allErrors } = processDatasets(loose);

  // 兜底降级：标准校验下无任何有效记录时，自动用宽松模式重试（兼容任意格式）
  if (!loose && allValid.length === 0 && allErrors.length > 0) {
    log('标准校验下无有效记录，已自动切换为「见证台账宽松导入」模式重试', 'warn');
    loose = true;
    ({ valid: allValid, errors: allErrors } = processDatasets(true));
  }

  // 记录级去重：仅当报告编号或试件编号非空时去重（宽松导入的空编号“待补录”行各自保留）
  const finalValid = [];
  const seen = new Set();
  S.records.forEach(r => { if (!r.is_deleted && (r.report_no || r.specimen_no)) seen.add(`${r.report_no}|${r.specimen_no}`); });
  for (const rec of allValid) {
    if (rec.report_no || rec.specimen_no) {
      const k = `${rec.report_no}|${rec.specimen_no}`;
      if (seen.has(k)) { allErrors.push({ ...rec, errors: ['报告编号+试件编号 已存在，重复导入'] }); continue; }
      seen.add(k);
    }
    finalValid.push(rec);
  }

  // 写入
  if (finalValid.length) {
    try {
      await DB.bulkPut('records', finalValid);
      await DB.putFileHash(hash, file.name);
      S.records = await DB.getAll('records');
    } catch (e) {
      log('写入数据库失败：' + ((e && e.message) || e), 'err');
      return;
    }
  }
  log(`导入完成：有效 ${finalValid.length} 条，错误 ${allErrors.length} 条`, finalValid.length ? 'ok' : 'warn');
  if (allErrors.length) {
    log(`生成错误清单`, 'warn');
    downloadErrorList(allErrors, file.name);
  }
}

// 类别关键词别名（用于 sheet 名 / Word 表题 的模糊识别）
const CATEGORY_KEYWORDS = {
  concrete_compressive: ['混凝土抗压', '抗压强度'],
  rebar_tensile: ['钢筋原材', '钢筋拉伸'],
  rebar_welded_joint: ['焊接接头', '钢筋焊接'],
  mortar_compressive: ['砂浆'],
  concrete_flexural: ['抗折', '弯拉'],
  concrete_impermeability: ['抗渗'],
  concrete_frost: ['抗冻', '冻融'],
  compaction_degree: ['压实度', '压实', '原位密度', '干密度', '回填'],
  rebar_mech_joint: ['机械连接', '直螺纹', '套筒'],
  prestress_strand: ['钢绞线', '预应力'],
  pile_integrity: ['桩身', '桩基', '完整性'],
  cement_material: ['水泥']
};

function matchCategoryBySheet(name) {
  const n = (name || '').replace(/\s/g, '');
  if (!n) return null;
  // 1) 先按类别名称精确/包含匹配，避免宽泛关键词误判（如"混凝土抗折"被"混凝土"抢走）
  for (const c of S.categories) if (n === c.name || n.includes(c.name)) return c.key;
  // 2) 再按关键词别名匹配
  for (const c of S.categories) {
    const kws = CATEGORY_KEYWORDS[c.key] || [];
    if (kws.some(k => n.includes(k))) return c.key;
  }
  return null;
}

// 行级识别：见证台账一张表内可能混多种试验项目，按每行「试验项目 / 材料名称」内容判类别
// 顺序敏感：先具体后宽泛（如钢绞线→机械连接→焊接→钢筋；抗折/抗渗/抗冻→砂浆→混凝土）
const ROW_CATEGORY_HINTS = [
  ['prestress_strand', ['钢绞线', '预应力']],
  ['rebar_mech_joint', ['机械连接', '直螺纹', '套筒']],
  ['rebar_welded_joint', ['焊接']],
  ['rebar_tensile', ['钢筋', 'HRB', 'HPB', '热轧']],
  ['concrete_flexural', ['抗折', '弯拉']],
  ['concrete_impermeability', ['抗渗']],
  ['concrete_frost', ['抗冻', '冻融']],
  ['mortar_compressive', ['砂浆']],
  ['pile_integrity', ['桩身', '桩基', '低应变', '声波透射', '完整性']],
  ['cement_material', ['水泥']],
  ['compaction_degree', ['原位密度', '灌砂', '环刀', '击实', '压实', '干密度', '回填']],
  ['concrete_compressive', ['砼', '混凝土', '抗压', '试块']]
];

function detectCategoryByText(t) {
  const n = (t || '').replace(/\s/g, '');
  for (const [key, kws] of ROW_CATEGORY_HINTS) {
    if (S.categories.some(c => c.key === key) && kws.some(k => n.includes(k))) return key;
  }
  return null;
}

function detectCategoryByRow(row, tableName) {
  const keys = Object.keys(row);
  const findCol = (...cands) => {
    for (const c of cands) { const k = keys.find(k => k.includes(c)); if (k && row[k]) return row[k]; }
    return '';
  };
  const text = [
    tableName,
    findCol('试验项目', '检测项目', '项目类别'),
    findCol('材料名称', '试件（材料）名称', '试件(材料)名称', '名称'),
    findCol('检测依据', '依据')
  ].join(' ');
  return detectCategoryByText(text);
}

// ---------- Word(.docx) 解析：读取 word/document.xml 中的表格 ----------
async function readDocxTables(buf) {
  const files = await unzipEntries(buf, (n) => n === 'word/document.xml');
  const docBytes = files['word/document.xml'];
  if (!docBytes) throw new Error('未在 Word 文档中找到正文（word/document.xml）');
  const xml = new TextDecoder('utf-8').decode(docBytes);
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Word 正文解析失败');
  const body = firstByLocal(doc, 'body') || doc.documentElement;
  const datasets = [];
  let title = '';
  for (const node of Array.from(body.childNodes)) {
    if (node.nodeType !== 1) continue;
    if (node.localName === 'p') {
      const t = collectWordText(node).trim();
      if (t) title = t;
    } else if (node.localName === 'tbl') {
      const matrix = [];
      for (const tr of Array.from(node.childNodes)) {
        if (tr.nodeType !== 1 || tr.localName !== 'tr') continue;
        const cells = [];
        for (const tc of Array.from(tr.childNodes)) {
          if (tc.nodeType !== 1 || tc.localName !== 'tc') continue;
          cells.push(collectWordText(tc).trim());
        }
        matrix.push(cells);
      }
      const rows = matrixToRecords(matrix);
      if (rows.length) datasets.push({ name: title || ('表格' + (datasets.length + 1)), rows });
    }
  }
  return datasets;
}

function collectWordText(el) {
  let s = '';
  for (const n of el.getElementsByTagName('*')) {
    if (n.localName === 't') s += n.textContent;
  }
  return s;
}

function firstByLocal(root, name) {
  for (const n of root.getElementsByTagName('*')) if (n.localName === name) return n;
  return null;
}

// 空白行判定：除「序号」外没有任何内容（见证台账常预留大量带序号的空行）
function isEmptyDataRow(row) {
  return Object.entries(row).every(([k, v]) => k === '序号' || String(v ?? '').trim() === '');
}

// 见证台账表头识别：含「试验编号/试验项目/代表部位/试验结果」等标记列时视为见证台账，自动宽松导入
function looksLikeWitnessLedger(datasets) {
  const marks = ['试验编号', '试验项目', '代表部位', '试验结果', '土料分析'];
  return datasets.some(ds => {
    const keys = Object.keys(ds.rows[0] || {});
    return marks.some(mk => keys.includes(mk));
  });
}

// 是否「待补录」：仅见证台账宽松导入、且没有「试验编号」(report_no) 的行才需补录。
// 有试验编号即代表已有依据，标段/单位工程/分部工程/规格等可留空，不再标记待补录。
function isNeedComplete(r) {
  return r.import_mode === 'witness_loose' && !r.report_no;
}

// 表格矩阵（首行为表头）→ 记录数组，供 mapRowToRecord 复用
function matrixToRecords(matrix) {
  if (!matrix.length) return [];
  const header = matrix[0].map(h => String(h || '').replace(/\s+/g, '').trim());
  const rows = [];
  for (let i = 1; i < matrix.length; i++) {
    const r = matrix[i];
    // 整行为空、或仅「序号」列有值（预留空行）则跳过
    if (!r.some((c, j) => header[j] !== '序号' && String(c || '').trim() !== '')) continue;
    const obj = {};
    header.forEach((h, j) => { if (h) obj[h] = r[j] !== undefined ? String(r[j]).trim() : ''; });
    rows.push(obj);
  }
  return rows;
}

// ---------- 最小 ZIP 解包（.docx 即 ZIP），仅解压指定条目 ----------
async function unzipEntries(buf, want) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  const n = u8.length;
  let eocd = -1;
  const minPos = Math.max(0, n - 22 - 65535);
  for (let i = n - 22; i >= minPos; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 .docx 文件（未找到 ZIP 结束记录）');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let k = 0; k < count && p + 46 <= n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (!want(name)) continue;
    if (localOffset + 30 > n || dv.getUint32(localOffset, true) !== 0x04034b50) continue;
    const lNameLen = dv.getUint16(localOffset + 26, true);
    const lExtraLen = dv.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const comp = u8.subarray(dataStart, dataStart + compSize);
    out[name] = method === 0 ? comp : await inflateRaw(comp);
  }
  return out;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持解压 .docx，请升级到较新版 Chrome / Edge');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const ab = await new Response(stream).arrayBuffer();
  return new Uint8Array(ab);
}

const HEADER_MAP = {
  'report_no': ['报告编号', '报告号', '试验编号', '委托编号'],
  'specimen_no': ['试件编号', '样品编号'],
  'test_date': ['检测日期', '试验日期'],
  'section': ['标段'],
  'unit_engineering': ['单位工程', '单位工程名称'],
  'division': ['分部工程', '分部工程名称', '分部'],
  'part': ['部位', '代表部位', '工程部位'],
  'spec': ['规格', '规格型号', '强度等级', '设计强度等级'],
  'representative_batch': ['代表批量', '代表数量', '组数'],
  'test_unit': ['检测单位', '试验单位'],
  'construction_signer': ['施工签字', '施工单位签字', '施工签字人'],
  'construction_sign_date': ['施工签字日期', '施工签字时间'],
  'supervision_signer': ['监理签字', '监理单位签字', '监理签字人'],
  'supervision_sign_date': ['监理签字日期', '监理签字时间'],
  'judgment': ['判定', '判定结果', '结论', '试验结果'],
  'remark': ['备注', '土料分析']
};

function pickField(row, key) {
  const aliases = HEADER_MAP[key] || [];
  for (const a of aliases) { if (row[a] !== undefined && row[a] !== '') return row[a]; }
  // 模糊匹配
  const keys = Object.keys(row);
  for (const a of aliases) {
    const k = keys.find(k => k.includes(a));
    if (k && row[k] !== undefined && row[k] !== '') return row[k];
  }
  return undefined;
}

function pickCategoryField(row, f) {
  // 精确匹配 label → 包含匹配 label/别名（兼容模板表头带 * 后缀及旧版列名）
  if (row[f.label] !== undefined && row[f.label] !== '') return row[f.label];
  const keys = Object.keys(row);
  const cands = [f.label, ...(f.aliases || [])];
  for (const c of cands) {
    const k = keys.find(k => k.includes(c));
    if (k !== undefined && row[k] !== undefined && row[k] !== '') return row[k];
  }
  if (row[f.key] !== undefined && row[f.key] !== '') return row[f.key];
  return undefined;
}

function mapRowToRecord(row, cat, sourceFile) {
  const cf = {};
  for (const f of cat.fields) {
    const v = pickField(row, f.key) || pickCategoryField(row, f);
    if (v !== undefined && v !== '') {
      cf[f.key] = f.type === 'number' ? Number(v) : v;
    }
  }
  // 源数据判定（模板“判定”列 / 见证台账“试验结果”列）：规范化为 合格/不合格/空
  const rawJudge = String(pickField(row, 'judgment') || '').trim();
  let judgment = '';
  if (rawJudge.includes('不合格')) judgment = '不合格';
  else if (rawJudge.includes('合格')) judgment = '合格';
  const now = Date.now();
  return {
    record_id: uuid(),
    report_no: String(pickField(row, 'report_no') || '').trim(),
    specimen_no: String(pickField(row, 'specimen_no') || '').trim(),
    test_date: pickField(row, 'test_date') || '',
    section: String(pickField(row, 'section') || '').trim(),
    unit_engineering: String(pickField(row, 'unit_engineering') || '').trim(),
    division: String(pickField(row, 'division') || '').trim(),
    part: String(pickField(row, 'part') || '').trim(),
    unit_work: String(pickField(row, 'unit_work') || pickField(row, 'part') || '').trim(),
    category: cat.key,
    spec: String(pickField(row, 'spec') || '').trim(),
    representative_batch: Number(pickField(row, 'representative_batch')) || 0,
    test_unit: String(pickField(row, 'test_unit') || '').trim(),
    construction_signer: String(pickField(row, 'construction_signer') || '').trim(),
    construction_sign_date: pickField(row, 'construction_sign_date') || '',
    supervision_signer: String(pickField(row, 'supervision_signer') || '').trim(),
    supervision_sign_date: pickField(row, 'supervision_sign_date') || '',
    judgment,
    remark: String(pickField(row, 'remark') || '').trim(),
    category_fields: cf,
    is_deleted: false,
    created_at: now,
    updated_at: now,
    source_file: sourceFile
  };
}

function validateRecord(rec, cat, loose) {
  const errs = [];
  if (loose) {
    // 见证台账宽松模式：编号/标段/分部/规格等均允许入库后补录；整行无任何可辨识信息才拒绝
    if (!rec.report_no && !rec.specimen_no && !rec.part) errs.push('报告编号/试件编号/部位均为空');
    return errs;
  }
  if (!rec.report_no) errs.push('报告编号为空');
  if (!rec.specimen_no) errs.push('试件编号为空');
  if (!rec.section) errs.push('标段为空');
  if (S.sections.length && !S.sections.some(s => s.code === rec.section)) errs.push(`标段 "${rec.section}" 不在预定义清单`);
  if (!rec.unit_engineering) errs.push('单位工程为空');
  if (S.unitEngineerings.length && !S.unitEngineerings.some(u => u.ue_code === rec.unit_engineering || u.ue_name === rec.unit_engineering)) {
    // 单位工程允许自由填，这里只警告不拒绝 —— 改为不报错
  }
  if (!rec.division) {
    errs.push('分部工程为空');
  } else if (S.divisions.length) {
    const ueDivs = S.divisions.filter(d => d.ue_code === rec.unit_engineering || d.ue_name === rec.unit_engineering);
    if (ueDivs.length && !ueDivs.some(d => d.name === rec.division)) {
      errs.push(`分部工程 "${rec.division}" 不在单位工程 "${rec.unit_engineering}" 的项目划分清单`);
    }
  }
  if (!rec.spec) errs.push('规格为空');
  const specEnum = S.specs[cat.spec_enum_key] || [];
  if (specEnum.length && !specEnum.includes(rec.spec)) errs.push(`规格 "${rec.spec}" 不在 ${cat.name} 规格枚举`);
  if (!rec.test_date) errs.push('检测日期为空');
  for (const f of cat.fields) {
    if (f.required && (rec.category_fields[f.key] === undefined || rec.category_fields[f.key] === '')) {
      errs.push(`类别字段 "${f.label}" 为空`);
    }
  }
  return errs;
}

function downloadErrorList(errors, sourceFile) {
  const data = errors.map(e => ({
    '来源Sheet': e.sheet || '',
    'Excel行号': e.row || '',
    '报告编号': e.report_no,
    '试件编号': e.specimen_no,
    '标段': e.section,
    '单位工程': e.unit_engineering,
    '分部工程': e.division,
    '部位': e.part,
    '类别': getCategory(e.category)?.name || e.category,
    '规格': e.spec,
    '检测日期': formatDate(e.test_date),
    '错误原因': (e.errors || []).join('；')
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '错误清单');
  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  const fname = '错误清单_' + sourceFile.replace(/\.(xlsx?|docx?)$/i, '') + '_' + todayStr() + '.xlsx';
  downloadBlob(new Blob([out], { type: 'application/octet-stream' }), fname);
}

// ========================= 台账 =========================
function renderLedger() {
  const recs = activeRecords();
  const f = S.ledgerFilters;
  let list = recs;
  if (f.section) list = list.filter(r => r.section === f.section);
  if (f.division) list = list.filter(r => r.division === f.division);
  if (f.category) list = list.filter(r => r.category === f.category);
  if (f.judgment) list = list.filter(r => r.judgment === f.judgment);
  if (f.needComplete) list = list.filter(isNeedComplete);
  if (f.keyword) {
    const k = f.keyword.toLowerCase();
    list = list.filter(r => (r.report_no + r.specimen_no + (r.division || '') + (r.unit_work || r.part || '') + r.remark).toLowerCase().includes(k));
  }
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / S.pageSize));
  if (S.ledgerPage > pages) S.ledgerPage = pages;
  const start = (S.ledgerPage - 1) * S.pageSize;
  const pageList = list.slice(start, start + S.pageSize);

  const sectionOpts = S.sections.map(s => s.code);
  const catOpts = S.categories;

  let html = `<div class="card"><h2>检测记录台账（共 ${total} 条）</h2>
    <div class="toolbar">
      <label>标段</label>
      <select id="fSection" onchange="applyFilter('section',this.value)">
        <option value="">全部</option>${[...new Set(recs.map(r => r.section))].sort().map(s => `<option ${f.section === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      <label>分部工程</label>
      <select id="fDivision" onchange="applyFilter('division',this.value)">
        <option value="">全部</option>${[...new Set(recs.map(r => r.division).filter(Boolean))].sort().map(s => `<option ${f.division === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      <label>类别</label>
      <select id="fCategory" onchange="applyFilter('category',this.value)">
        <option value="">全部</option>${catOpts.map(c => `<option value="${c.key}" ${f.category === c.key ? 'selected' : ''}>${c.name}</option>`).join('')}
      </select>
      <label>判定</label>
      <select id="fJudgment" onchange="applyFilter('judgment',this.value)">
        <option value="">全部</option><option ${f.judgment === '合格' ? 'selected' : ''}>合格</option><option ${f.judgment === '不合格' ? 'selected' : ''}>不合格</option>
      </select>
      <input id="fKeyword" placeholder="报告/试件/分部/单元工程/备注 关键词" value="${f.keyword || ''}" onchange="applyFilter('keyword',this.value)">
      <label style="font-weight:normal;white-space:nowrap"><input type="checkbox" ${f.needComplete ? 'checked' : ''} onchange="applyFilter('needComplete',this.checked)"> 仅看待补录</label>
      <button class="btn ghost sm" onclick="S.ledgerFilters={};S.ledgerPage=1;renderContent()">重置</button>
      <span style="margin-left:auto" class="muted">双击单元格可编辑 · 判定列不可编辑（自动判定）</span>
    </div>
    <div style="overflow:auto;max-height:65vh"><table>
    <thead><tr>
      <th>标段</th><th>单位工程</th><th>分部工程</th><th>单元工程</th><th>类别</th><th>规格</th>
      <th>报告编号</th><th>试件编号</th><th>检测日期</th><th>类别字段</th>
      <th>判定</th><th>操作</th>
    </tr></thead><tbody>`;

  for (const r of pageList) {
    const cat = getCategory(r.category);
    const cf = r.category_fields || {};
    const cfText = cat ? cat.fields.map(fd => fd.label + ':' + (cf[fd.key] ?? '')).join(' ｜ ') : '';
    const cls = r.judgment === '不合格' ? 'bad' : '';
    const needComplete = isNeedComplete(r);
    html += `<tr class="${cls}" data-id="${r.record_id}">
      <td class="editable" data-field="section">${r.section}</td>
      <td class="editable" data-field="unit_engineering">${r.unit_engineering}</td>
      <td class="editable" data-field="division">${r.division || ''}</td>
      <td class="editable" data-field="unit_work">${r.unit_work || ''}</td>
      <td>${cat?.name || r.category}${needComplete ? ' <span class="tag" title="见证台账宽松导入，无试验编号，需补录编号">待补录</span>' : ''}</td>
      <td class="editable" data-field="spec">${r.spec}</td>
      <td class="editable" data-field="report_no">${r.report_no}</td>
      <td class="editable" data-field="specimen_no">${r.specimen_no}</td>
      <td class="editable" data-field="test_date">${formatDate(r.test_date)}</td>
      <td><span class="muted" title="${cfText}">${cfText.length > 40 ? cfText.slice(0, 40) + '…' : cfText}</span></td>
      <td>${r.judgment === '不合格' ? '<span class="tag red">不合格</span>' : '<span class="tag green">合格</span>'}</td>
      <td><button class="btn danger sm" onclick="softDeleteRec('${r.record_id}')">删除</button></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  // 分页
  html += `<div class="pagination">
    <button ${S.ledgerPage === 1 ? 'disabled' : ''} onclick="S.ledgerPage--;renderContent()">上一页</button>
    <span>第 ${S.ledgerPage} / ${pages} 页</span>
    <button ${S.ledgerPage === pages ? 'disabled' : ''} onclick="S.ledgerPage++;renderContent()">下一页</button>
  </div></div>`;

  // 显示已删除（软删恢复）
  const deleted = S.records.filter(r => r.is_deleted);
  if (deleted.length) {
    html += `<div class="card"><h2>已删除记录（${deleted.length} 条，可恢复）</h2>
      <table><thead><tr><th>标段</th><th>报告编号</th><th>试件编号</th><th>判定</th><th>操作</th></tr></thead><tbody>`;
    for (const r of deleted) {
      html += `<tr class="deleted"><td>${r.section}</td><td>${r.report_no}</td><td>${r.specimen_no}</td><td>${r.judgment}</td>
        <td><button class="btn sm" onclick="restoreRec('${r.record_id}')">恢复</button></td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  return html;
}

// ========================= 预控矩阵 =========================
// 行=S.divisions（186 个分部工程），列=S.categories（12 个试验类别）
// cell = 该分部该类别下所有记录的判定汇总；空=尚未导入
function renderMatrix() {
  const recs = activeRecords();
  const cats = S.categories;
  const divisions = S.divisions;
  const f = S.matrixFilters || (S.matrixFilters = {});

  // 标段筛选
  let rows = divisions;
  if (f.section) rows = rows.filter(d => d.section === f.section);

  // 先建索引：key = division.code + '|' + category.key
  const index = {};
  for (const r of recs) {
    // 用 division.code 匹配（项目划分里的分部唯一编码），匹配不到再用 division.name 模糊匹配
    const dCode = S.divisions.find(d => d.name === r.division && d.section === r.section);
    const dKey = dCode ? dCode.code : (r.division || '');
    const k = dKey + '|' + r.category;
    if (!index[k]) index[k] = { total: 0, pass: 0, fail: 0, list: [] };
    index[k].total++;
    if (r.judgment === '合格') index[k].pass++;
    else if (r.judgment === '不合格') index[k].fail++;
    index[k].list.push(r);
  }

  // 预控完整性统计（仅统计有记录的行）
  let rowsWithData = 0, filled = 0, empty = 0;
  for (const d of rows) {
    let rowHas = false;
    for (const c of cats) {
      const k = d.code + '|' + c.key;
      if (index[k]) { filled++; rowHas = true; } else { empty++; }
    }
    if (rowHas) rowsWithData++;
  }

  let html = `<div class="card">
    <h2>预控矩阵（${rows.length} 分部工程 × ${cats.length} 试验类别）</h2>
    <div class="toolbar">
      <label>标段</label>
      <select id="mSection" onchange="S.matrixFilters={section:this.value};renderContent()">
        <option value="">全部</option>${S.sections.map(s => `<option ${f.section === s.code ? 'selected' : ''}>${s.code}</option>`).join('')}
      </select>
      <span class="muted" style="margin-left:auto">已有 ${rowsWithData} 个分部工程导入记录 / ${filled} 个单元格有数据 / ${empty} 个单元格待试验</span>
      <button class="btn sm" onclick="exportMatrixXlsx()">导出矩阵 xlsx</button>
      <button class="btn ghost sm" onclick="S.matrixFilters={};renderContent()">重置</button>
    </div>
    <div style="overflow:auto;max-height:70vh;font-size:12px"><table>
    <thead><tr>
      <th style="position:sticky;left:0;background:#f8fafc">标段</th>
      <th style="position:sticky;left:60px;background:#f8fafc">单位工程</th>
      <th style="position:sticky;left:180px;background:#f8fafc">分部工程</th>
      ${cats.map(c => `<th>${c.name}</th>`).join('')}
    </tr></thead><tbody>`;

  for (const d of rows) {
    const ue = S.unitEngineerings.find(u => u.ue_code === d.ue_code || u.section === d.section);
    const row = `
      <tr data-div="${d.code}">
        <td style="position:sticky;left:0;background:#fff">${d.section}</td>
        <td style="position:sticky;left:60px;background:#fff">${d.ue_name}</td>

// 导出矩阵 xlsx（含空行预控，导入行自动填充）
function exportMatrixXlsx() {
  const recs = activeRecords();
  const cats = S.categories;
  const divisions = S.divisions;
  const wb = XLSX.utils.book_new();

  // Sheet 1: 预控矩阵（全空行骨架 + 已填充判定）
  const header = ['标段', '单位工程', '分部工程', '单元工程', ...cats.map(c => c.name + '(合格/总数)')];
  const rows = [header];
  for (const d of divisions) {
    const ue = S.unitEngineerings.find(u => u.ue_code === d.ue_code || u.section === d.section);
    const row = [d.section, ue?.ue_name || '', d.name, ''];
    for (const c of cats) {
      const dCode = d.code;
      const list = recs.filter(r => {
        const m = S.divisions.find(x => x.name === r.division && x.section === r.section);
        return ((m && m.code === dCode) || r.division === d.name) && r.category === c.key;
      });
      if (!list.length) { row.push(''); }
      else {
        const pass = list.filter(r => r.judgment === '合格').length;
        row.push(`${pass}/${list.length}`);
      }
    }
    rows.push(row);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '预控矩阵');

  // Sheet 2: 完整台账（流水）
  if (recs.length) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recs.map(recordToRow)), '流水台账');
  }

  // Sheet 3: 统计表（标段×类别 汇总）
  const sections = [...new Set(divisions.map(d => d.section))];
  const sumHeader = ['标段\\类别', ...cats.map(c => c.name), '合计'];
  const sumRows = [sumHeader];
  for (const sec of sections) {
    const secDivs = divisions.filter(d => d.section === sec);
    const row = [sec];
    let tSum = 0, fSum = 0;
    for (const c of cats) {
      const list = recs.filter(r => {
        const m = S.divisions.find(x => x.name === r.division && x.section === r.section);
        return (m && secDivs.some(sd => sd.code === m.code)) && r.category === c.key;
      });
      const pass = list.filter(r => r.judgment === '合格').length;
      const fail = list.length - pass;
      tSum += list.length; fSum += fail;
      row.push(list.length ? `${pass}/${list.length} (${fail ? '不合格' + fail : '全合格'})` : '');
    }
    row.push(tSum ? `${tSum - fSum}/${tSum}` : '');
    sumRows.push(row);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sumRows), '标段类别汇总');

  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  downloadBlob(new Blob([out], { type: 'application/octet-stream' }), `预控矩阵_${todayStr()}.xlsx`);
}

// ========================= OLE2 / 旧版 .doc 解析 =========================
// 仅提取纯文本 + 表格，输出与 readDocxTables 兼容结构 { tables: [matrix], paragraphs: [] }
async function parseDocFile(buf) {
  if (!(buf instanceof ArrayBuffer)) throw new Error('需要 ArrayBuffer');
  const ole = parseOLE(new Uint8Array(buf));
  const word = ole.streams.get('WordDocument');
  if (!word) throw new Error('.doc 文件里找不到 WordDocument 流');
  const table = ole.streams.get('1Table') || ole.streams.get('0Table');
  return parseWordDocument(word, table);
}

// OLE2 Compound Document 通用解析
function parseOLE(buf) {
  // 1. 校验头 magic
  if (buf[0] !== 0xD0 || buf[1] !== 0xCF) throw new Error('非 OLE2 文件');
  // 2. 读头
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const sectorShift = dv.getUint16(0x1E, true);          // 通常 9（512B）或 12（4KB）
  const sectorSize = 1 << sectorShift;
  const numFatSectors = dv.getUint32(0x2C, true);
  const firstDirSector = dv.getUint32(0x30, true);
  const miniStreamCutoff = dv.getUint32(0x38, true);      // 通常 4096
  const miniFatStart = dv.getUint32(0x3C, true);
  const numMiniFatSectors = dv.getUint32(0x40, true);
  const difatStart = dv.getUint32(0x44, true);
  const numDifatSectors = dv.getUint32(0x48, true);
  // 3. 收集所有扇区 → 拼完整文件数据（跳过 512B 头）
  const fileData = new Uint8Array(buf.buffer, buf.byteOffset + sectorSize, buf.byteLength - sectorSize);
  const fileDv = new DataView(fileData.buffer, fileData.byteOffset, fileData.byteLength);

  // 4. 读 DIFAT（间接 FAT）
  const FAT = new Uint32Array(numFatSectors * Math.floor(sectorSize / 4));
  let fatIdx = 0;
  const pushFatSector = (secIdx) => {
    if (secIdx === 0xFFFFFFFD || secIdx === 0xFFFFFFFE || secIdx === 0xFFFFFFFF) return;
    const offset = secIdx * sectorSize;
    for (let i = 0; i < sectorSize / 4 && fatIdx < FAT.length; i++) {
      FAT[fatIdx++] = fileDv.getUint32(offset + i * 4, true);
    }
  };
  // DIFAT 前 109 个条目直接在头里
  for (let i = 0; i < 109 && i < numFatSectors; i++) {
    const v = dv.getUint32(0x4C + i * 4, true);
    pushFatSector(v);
  }
  // DIFAT 扇区链（间接 FAT 条目）
  let cur = difatStart;
  for (let d = 0; d < numDifatSectors; d++) {
    if (cur >= 0xFFFFFFF0) break;
    const off = cur * sectorSize;
    const chain = fileDv.getUint32(off + sectorSize - 4, true);
    for (let i = 0; i < sectorSize / 4 - 1; i++) {
      const v = fileDv.getUint32(off + i * 4, true);
      if (v >= 0xFFFFFFF0) break;
      pushFatSector(v);
    }
    cur = chain;
  }

  // 5. 读 Directory 扇区链 → 提取每个 stream
  const streamChain = [];
  cur = firstDirSector;
  while (cur < 0xFFFFFFF0) {
    const off = cur * sectorSize;
    for (let i = 0; i < sectorSize / 128; i++) {
      const base = off + i * 128;
      const nameLen = dv.getUint16(512 + base + 64, true);
      if (nameLen === 0) continue;
      const name = decodeUTF16LE(buf, 512 + base, nameLen).replace(/\0+$/, '');
      const startSec = dv.getUint32(512 + base + 116, true);
      const size = dv.getUint32(512 + base + 120, true);
      streamChain.push({ name, startSec, size });
    }
    cur = FAT[cur];
  }

  // 6. 读 MiniFat（用于 < miniStreamCutoff 的流）
  const miniFAT = new Uint32Array(Math.max(numMiniFatSectors * Math.floor(sectorSize / 4), 4096 / 4));
  fatIdx = 0;
  let mcur = miniFatStart;
  while (mcur < 0xFFFFFFF0) {
    const off = mcur * sectorSize;
    for (let i = 0; i < sectorSize / 4 && fatIdx < miniFAT.length; i++) {
      miniFAT[fatIdx++] = fileDv.getUint32(off + i * 4, true);
    }
    mcur = FAT[mcur];
  }
  // 找到 MiniStream 流（Root Entry 子流）
  let miniStreamBuf = null, miniStart = 0;
  for (const e of streamChain) {
    if (e.name === 'Mini Stream' || e.name === '\x01CompObj') {
      // 从 Root Entry 取 mini stream，找 Storage 0 下的第一条
      break;
    }
  }
  // 更直接：遍历所有流，找 size > miniStreamCutoff 的走 FAT 扇区链，小的后续走 miniFAT
  const streams = new Map();
  for (const e of streamChain) {
    if (e.size === 0) { streams.set(e.name, new Uint8Array(0)); continue; }
    if (e.size < miniStreamCutoff) {
      // Mini 流：MiniStream 起始在 streamChain 里找 name='Mini Stream'
      let miniEntry = streamChain.find(s => s.name === 'Mini Stream' || s.name === '\x01CompObj');
      // 实际上 Mini Stream 的起始位置在 Root Entry（index=0）的 startSec/size
      // 简化处理：跳过小于 cutoff 的（.doc 里 WordDocument 通常 > 512KB 不会走 mini）
      continue;
    }
    // 大流：FAT 扇区链
    const out = new Uint8Array(e.size);
    let w = 0; let s = e.startSec;
    while (s < 0xFFFFFFF0 && w < e.size) {
      const off = s * sectorSize;
      const toCopy = Math.min(sectorSize, e.size - w);
      out.set(fileData.subarray(off, off + toCopy), w);
      w += toCopy; s = FAT[s];
    }
    streams.set(e.name, out);
  }

  return { streams };
}

function decodeUTF16LE(buf, offset, len) {
  const out = [];
  for (let i = 0; i < len - 1; i += 2) {
    out.push(String.fromCharCode(buf[offset + i] | (buf[offset + i + 1] << 8)));
  }
  return out.join('');
}

// WordDocument 解析：读取 FIB → 文本片段表 → 表格边界 → 文本/表格提取
function parseWordDocument(wordBuf, tableBuf) {
  const dv = new DataView(wordBuf.buffer, wordBuf.byteOffset, wordBuf.byteLength);

  // 1. 读 FIB（FibBase + FibRgCswNew）
  const fcCompressed = dv.getUint16(0x0044, true);   // 0x0044=未压缩(UTF-16), 0x0044 以外？按 0x0044 看
  const isCompressed = dv.getUint16(0x0044, true) !== 0x0044; // 简化：0x0044=压缩
  const ccpText = dv.getUint32(0x004C, true);          // 主文本字符数
  const fcClx = dv.getUint32(0x01A2, true);            // 文本片段表 fc
  const lcbClx = dv.getUint32(0x01A6, true);           // 文本片段表长度
  const fcPlcBte = dv.getUint32(0x01B0, true);          // 表格边界 fc
  const lcbPlcBte = dv.getUint32(0x01B4, true);

  // 2. 取 Clx（文本片段表）
  const clxBuf = wordBuf.subarray(fcClx, fcClx + lcbClx);
  // 3. 取主文本（通常在 WordDocument 主流前面部分，或从 Table stream 解析更准确）
  //    简化：先尝试从主文本区提取段，再用 PlcBte 做表格
  const paragraphs = [];
  const tables = [];
  const isUTF16 = !isCompressed;

  // 从主文本区提取段落
  const textBuf = wordBuf.subarray(2048, Math.min(2048 + (ccpText * (isUTF16 ? 2 : 1)), wordBuf.length));
  let text = '';
  try {
    text = isUTF16
      ? new TextDecoder('utf-16le').decode(textBuf.filter((b, i) => i % 2 === 0 || textBuf[i] !== 0))
      : new TextDecoder('gbk', { fatal: false }).decode(textBuf);
  } catch (_) {
    try { text = new TextDecoder('utf-8').decode(textBuf); } catch (__) {}
  }

  // 分段：\r 或 \n 或 \x0B（软回车）或 \x07（cell 分隔）
  const rawParas = text.split(/[\r\u0007]+/).filter(p => p.trim());
  // 过滤掉控制字符残留
  for (const p of rawParas) {
    const cleaned = p.replace(/[\x00-\x08\x0B-\x1F]/g, '').trim();
    if (cleaned) paragraphs.push(cleaned);
  }

  // 4. 从 1Table/0Table 读 PlcBte 表格边界 → 重建表格
  //    Table stream 是 OLE stream，先做 FAT 解析
  if (tableBuf && lcbPlcBte > 0 && tableBuf.length > lcbPlcBte) {
    // 直接在 tableBuf 里按 fcPlcBte 定位（WordDocument 里的 fcPlcBte 是相对于 WordDocument 流的）
    // 简化方案：按段落文本里的 "\u0007"（cell mark）和 "\u000D"（para mark）重建表格
    //          从 paragraphs 中识别出表格段落（含多个 \x07 分隔），组装成 matrix
    // 实际上 Word 的 table 数据存于 1Table/0Table stream 里按 fcClx+PlcBte 定位
    // MVP 简化：把 paragraphs 里包含 "\u0007" 的段当成表格行
    const rows = [];
    for (const p of rawParas) {
      if (p.includes('\u0007')) {
        const cells = p.split('\u0007').map(c => c.replace(/[\x00-\x08\x0B-\x1F]/g, '').trim()).filter(c => c);
        if (cells.length >= 2) rows.push(cells);
      }
    }
    // 简单启发式：从 rows 里切出多张表（遇到空行或表头变化）
    let curTable = [];
    for (const r of rows) {
      curTable.push(r);
      if (r.length <= 1) {
        if (curTable.length >= 2) tables.push(curTable);
        curTable = [];
      }
    }
    if (curTable.length >= 2) tables.push(curTable);
  }

  // fallback：从 paragraphs 重建（把连续多行视为单表）
  if (!tables.length && paragraphs.length > 1) {
    tables.push([paragraphs]);
  }

  return { tables, paragraphs };
}

function bindLedger() {
  document.querySelectorAll('td.editable').forEach(td => {
    td.ondblclick = () => {
      const id = td.closest('tr').dataset.id;
      const field = td.dataset.field;
      const rec = S.records.find(r => r.record_id === id);
      if (!rec) return;
      const old = rec[field] || '';
      td.contentEditable = 'true';
      td.focus();
      // 选中内容
      const range = document.createRange();
      range.selectNodeContents(td);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const finish = async (save) => {
        td.contentEditable = 'false';
        if (save) {
          const v = td.textContent.trim();
          if (v !== old) {
            rec[field] = v;
            rec.updated_at = Date.now();
            if (field === 'spec' || field === 'category') rec.judgment = judgeRecord(rec);
            await DB.put('records', rec);
            S.records = await DB.getAll('records');
          }
        } else {
          td.textContent = old;
        }
        renderContent();
      };
      td.onblur = () => finish(true);
      td.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); td.blur(); }
        if (e.key === 'Escape') { td.textContent = old; td.blur(); finish(false); }
      };
    };
  });
}

function exportJsonBackup() {
  const backup = {
    exported_at: new Date().toISOString(),
    categories: S.categories,
    standards: S.standards,
    specs: S.specs,
    sections: S.sections,
    unit_engineerings: S.unitEngineerings,
    divisions: S.divisions,
    signers: [...S.signers.construction, ...S.signers.supervision],
    test_units: S.testUnits,
    settings: S.settings,
    records: S.records
  };
  downloadJSON(backup, '台账数据备份_' + todayStr() + '.json');
}
async function importJsonBackup(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm('恢复将覆盖当前所有数据，确认继续？')) { input.value = ''; return; }
  const text = await file.text();
  const data = JSON.parse(text);
  await Promise.all([
    DB.clear('records'), DB.clear('categories'), DB.clear('standards'), DB.clear('sections'),
    DB.clear('unit_engineerings'), DB.clear('divisions'), DB.clear('signers'), DB.clear('test_units'), DB.clear('settings')
  ]);
  if (data.records) await DB.bulkPut('records', data.records);
  if (data.categories) await DB.bulkPut('categories', data.categories);
  if (data.standards) await DB.bulkPut('standards', data.standards);
  if (data.sections) await DB.bulkPut('sections', data.sections);
  if (data.unit_engineerings) await DB.bulkPut('unit_engineerings', data.unit_engineerings);
  if (data.divisions) await DB.bulkPut('divisions', data.divisions);
  if (data.signers) await DB.bulkPut('signers', data.signers);
  if (data.test_units) await DB.bulkPut('test_units', data.test_units);
  if (data.settings) {
    for (const [k, v] of Object.entries(data.settings)) await DB.put('settings', { k, v });
  }
  await loadConfig();
  renderContent();
  alert('恢复完成');
  input.value = '';
}

function recordToRow(r) {
  const cat = getCategory(r.category);
  const cf = r.category_fields || {};
  const row = {
    '标段': r.section,
    '单位工程': r.unit_engineering,
    '分部工程': r.division,
    '单元工程': r.unit_work || r.part || '',
    '检测项目类别': cat?.name || r.category,
    '规格型号': r.spec,
    '报告编号': r.report_no,
    '试件编号': r.specimen_no,
    '检测日期': formatDate(r.test_date),
    '代表批量': r.representative_batch,
    '检测单位': r.test_unit,
    '判定结果': r.judgment,
    '备注': r.remark,
    '导入方式': r.import_mode === 'witness_loose'
      ? (isNeedComplete(r) ? '见证台账(待补录)' : '见证台账(已识别)')
      : '标准模板'
  };
  if (cat) cat.fields.forEach(f => { row[f.label] = cf[f.key] ?? ''; });
  return row;
}

function exportFullLedger() {
  const recs = activeRecords();
  // 按类别分 sheet
  const wb = XLSX.utils.book_new();
  const cats = [...new Set(recs.map(r => r.category))];
  for (const ck of cats) {
    const list = recs.filter(r => r.category === ck).sort((a, b) => new Date(a.test_date) - new Date(b.test_date));
    const cat = getCategory(ck);
    const ws = XLSX.utils.json_to_sheet(list.map(recordToRow));
    XLSX.utils.book_append_sheet(wb, ws, cat?.name || ck);
  }
  if (cats.length === 0) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['暂无数据']]), '空');
  }
  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  downloadBlob(new Blob([out], { type: 'application/octet-stream' }), '全标段质量检测统计台账_' + todayStr() + '.xlsx');
}

function exportMonthlySnapshot() {
  const now = new Date();
  const ym = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0');
  const recs = activeRecords();
  const thisMonth = recs.filter(r => {
    const d = new Date(r.test_date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  const failRecs = recs.filter(r => r.judgment === '不合格');

  const wb = XLSX.utils.book_new();

  // Sheet 1: 汇总看板
  const { sections, cats, matrix } = computeMatrix();
  const header = ['标段 \\ 类别', ...cats.map(k => getCategory(k)?.name || k), '合计'];
  const matrixRows = [header];
  for (const sec of sections) {
    const row = [sec];
    let tSum = 0, fSum = 0;
    for (const cat of cats) {
      const m = matrix[sec][cat];
      tSum += m.total; fSum += m.fail;
      row.push(m.total ? `${fmtPct(m.rate)} (${m.pass}/${m.total}, 不合格${m.fail})` : '—');
    }
    row.push(tSum ? `${fmtPct((tSum - fSum) / tSum)} (${tSum - fSum}/${tSum}, 不合格${fSum})` : '—');
    matrixRows.push(row);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matrixRows), '汇总看板');

  // Sheet 2: 本月新增
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(thisMonth.map(recordToRow)), '本月新增');

  // Sheet 3: 全量台账
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recs.map(recordToRow)), '全量台账');

  // Sheet 4: 不合格清单
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(failRecs.map(recordToRow)), '不合格清单');

  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  downloadBlob(new Blob([out], { type: 'application/octet-stream' }), `台账快照_${ym}.xlsx`);
  // 同步 JSON 备份
  exportJsonBackup();
}
